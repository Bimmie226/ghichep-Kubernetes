apiVersion: v1
kind: PersistentVolumeClaim 
metadata: 
  name: mariadb-pvc
  namespace: nextcloud
spec: 
  accessModes: 
    - ReadWriteMany 
  resources: 
    requests: 
      storage: 5Gi
  storageClassName: nfs-client  

---

apiVersion: v1
kind: Service 
metadata: 
  name: mariadb-service 
  namespace: nextcloud 
spec: 
  selector: 
    app: mariadb 
  ports: 
    - port: 3306
      targetPort: 3306
  
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb-statefulset
  namespace: nextcloud
spec:
  serviceName: mariadb-service
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      securityContext:
        fsGroup: 65534
      containers:
      - name: mariadb
        image: mariadb:11
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root"
        - name: MYSQL_DATABASE 
          value: "nextcloud"
        - name: MYSQL_USER
          value: "nextcloud" 
        - name: MYSQL_PASSWORD
          value: "nextcloud"  
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc
